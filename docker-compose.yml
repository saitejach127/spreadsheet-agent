version: "3.8"

services:
  backend:
    build:
      context: ./backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-""}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-""}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-""}
      - LOCAL_BASE_URL=${LOCAL_BASE_URL:-""}
    volumes:
      - ./backend/src:/app/src
    command: npm run dev

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://localhost:4000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    command: npm run dev
    depends_on:
      - backend
